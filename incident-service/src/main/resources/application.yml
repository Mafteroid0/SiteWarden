server:
  port: 8081

spring:
  application:
    name: incident-service

  datasource:
    url: jdbc:postgresql://localhost:5432/sitewarden_incidents
    username: incident_app
    password: ${INCIDENT_DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: incident-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.use.type.headers]": false
        "[spring.json.value.default.type]": ru.mafteroid.events.CheckCompletedEvent
        "[spring.json.trusted.packages]": ru.mafteroid.events