services:
  postgres:
    image: postgres:17-alpine
    container_name: sitewarden
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD-password}
      POSTGRES_DB: ${DB_NAME-sitewarden}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
