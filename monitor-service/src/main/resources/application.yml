spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:sitewarden}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

    flyway:
      enabled: true
      locations: classpath:db/migration