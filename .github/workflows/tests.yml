name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run tests
        run: bash ./gradlew --no-daemon :monitor-service:test :probe-worker:test :incident-service:test